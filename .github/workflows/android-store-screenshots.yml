name: SchonErledigt Android Store Screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build local debug APK
        run: gradle -p android --no-daemon assembleDebug --stacktrace

      - name: Enable KVM acceleration
        run: sudo chmod 666 /dev/kvm

      - name: Capture exact current SchonErledigt UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: PACKAGE_NAME='com.kamilunavo.schonerledigt' APK_PATH='android/app/build/outputs/apk/debug/app-debug.apk' OUTPUT_DIR='store/google-play/screenshots/de-DE' WAIT_TEXT='Nicht mehr zweimal fragen' SECOND_ACTION='tap' SECOND_TEXT='Weiter' SECOND_WAIT_TEXT='Bereit für den nächsten Tag' bash "$GITHUB_WORKSPACE/.github/scripts/capture-android-store-screenshots.sh"

      - name: Upload authentic screenshots
        uses: actions/upload-artifact@v4
        with:
          name: SchonErledigt-Play-Store-Screenshots-de-DE
          path: store/google-play/screenshots/de-DE/*.png
          if-no-files-found: error
          retention-days: 30

