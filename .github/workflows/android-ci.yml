name: SchonErledigt Android CI
on:
  push:
    branches: [main, 'android/**']
    paths: ['android/**', 'SchonErledigt/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png', 'store/google-play/**', '.github/workflows/android-ci.yml']
  pull_request:
    paths: ['android/**', 'SchonErledigt/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png', 'store/google-play/**', '.github/workflows/android-ci.yml']
  workflow_dispatch:
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.5.0' }
      - name: Verify exact iOS/Android launcher identity
        run: |
          set -euo pipefail
          test -s store/google-play/icon-512.png
          grep -Fq 'android:icon="@drawable/schonerledigt_store_icon"' android/app/src/main/AndroidManifest.xml
          ! grep -Fq 'android:roundIcon=' android/app/src/main/AndroidManifest.xml
          test ! -e android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test ! -e android/app/src/main/res/drawable/ic_launcher.xml
          test ! -e android/app/src/main/res/drawable/launcher_background.xml
          test ! -e android/app/src/main/res/drawable/launcher_foreground.xml
          gradle -p android verifyLauncherIconParity
          cmp -s SchonErledigt/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png android/app/src/main/res/drawable-nodpi/schonerledigt_store_icon.png
          sha256sum SchonErledigt/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png android/app/src/main/res/drawable-nodpi/schonerledigt_store_icon.png store/google-play/icon-512.png
      - run: gradle -p android testDebugUnitTest --stacktrace
      - run: gradle -p android bundleDebug --stacktrace
      - run: gradle -p android bundleRelease --stacktrace
      - name: Verify Play release and native design
        run: |
          set -euo pipefail
          test -f android/app/build/outputs/bundle/release/app-release.aab
          grep -Fq 'applicationId = "com.kamilunavo.schonerledigt"' android/app/build.gradle.kts
          grep -Fq 'versionCode = 5' android/app/build.gradle.kts
          grep -Fq 'versionName = "1.0.2"' android/app/build.gradle.kts
          grep -Fq 'targetSdk = 36' android/app/build.gradle.kts
          grep -Fq 'com.android.billingclient:billing-ktx:9.1.0' android/app/build.gradle.kts
          grep -Fq 'com.kamilunavo.schonerledigt.pro.yearly' android/app/src/main/java/com/kamilunavo/schonerledigt/BillingManager.kt
          grep -Fq 'com.kamilunavo.schonerledigt.pro.lifetime' android/app/src/main/java/com/kamilunavo/schonerledigt/BillingManager.kt
          if grep -RFn --include='*.kt' -e 'AndroidView(' -e 'WebView(' android/app/src/main/java; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: SchonErledigt-1.0.2-5-unsigned-release-aab
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            store/google-play/icon-512.png
          if-no-files-found: error
          retention-days: 30
